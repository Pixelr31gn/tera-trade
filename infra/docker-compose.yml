# Optional: only useful if you later install Docker Desktop. The database is
# Neon (hosted Postgres) via DATABASE_URL in ../.env -- there's no local
# database container here, so this compose file only runs the backend and
# frontend. Without Docker, run both natively instead (see README.md).
services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_KEY: ${API_KEY:-change-me-dev-key}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
