[tool.poetry]
name = "terra-trade"
version = "0.1.0"
description = "Terra Trade - production-grade algorithmic trading platform for Topstep futures accounts"
authors = ["Terra Trade"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.35" }
asyncpg = "^0.29.0"
alembic = "^1.13.3"
structlog = "^24.4.0"
httpx = "^0.27.2"
websockets = "^13.1"
signalrcore = "^0.9.5"
pandas = "^2.2.3"
numpy = "^2.1.2"
yfinance = "^0.2.44"
apscheduler = "^3.10.4"
scikit-learn = "^1.5.2"
joblib = "^1.4.2"
python-dotenv = "^1.0.1"
tenacity = "^9.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
